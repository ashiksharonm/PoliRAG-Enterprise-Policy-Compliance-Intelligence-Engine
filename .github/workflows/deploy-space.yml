# Pushes the demo to a Hugging Face Space, only when HF_TOKEN (secret) and HF_SPACE (variable,
# e.g. user/polirag-impact) are set.
name: Deploy Space
on:
  push:
    branches: [main]
    paths: ["space/**", "src/impact/**", "data/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "HF_TOKEN secret / HF_SPACE variable not set; skipping deploy."
      - name: Push to Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          mkdir -p space/src/eval space/data/eval space/data/versions
          cp src/__init__.py space/src/ && cp -r src/impact space/src/impact
          cp src/eval/__init__.py src/eval/retrieval_metrics.py space/src/eval/
          cp -r data/raw space/data/raw && cp -r data/versions/v2 space/data/versions/v2
          cp data/eval/retrieval_gold.json space/data/eval/
          cd space && git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
